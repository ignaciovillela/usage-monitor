name: release
# Al publicar un release, compila la app para macOS (Apple Silicon, instalador .dmg) y Windows (x64, .zip) y los adjunta.
# En los PR que tocan el empaquetado solo compila (sin adjuntar nada), para detectar roturas antes de publicar.
# Cada push a dev publica su propio pre-release vX.Y.Z-dev.N (N = número de commits, igual que la imagen del servidor)
# y conserva los últimos 10.
on:
  release:
    types: [published]
  push:
    branches: [dev]
  pull_request:
    paths:
      - "src/**"
      - "renderer/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag al que adjuntar los instaladores (vacío: solo compilar y dejarlos como artefactos)"
        required: false

permissions:
  contents: write
  id-token: write # login de Azure por OIDC para firmar en Windows

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # Versión y tag de esta compilación. En dev: X.Y.Z-dev.N con N = commits hasta aquí (el mismo N que usa la imagen).
  meta:
    runs-on: ubuntu-latest
    # Los pre-releases de dev los crea este workflow: publicarlos no debe recompilar nada.
    if: github.event_name != 'release' || !contains(github.event.release.tag_name, '-dev.')
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          base=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="$base-dev.$(git rev-list --count HEAD)"; tag="v$version"
          elif [ -n "$RELEASE_TAG" ]; then
            version="$base"; tag="$RELEASE_TAG"
          else
            version="$base"; tag="build-$GITHUB_RUN_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"; echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Versión $version · tag $tag"

  build:
    name: build (${{ matrix.name }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, script: "build:mac" }
          - { name: windows-x64, os: windows-latest, script: "build:win" }
    runs-on: ${{ matrix.os }}
    # El entorno «signing» es lo que autoriza la credencial federada de Azure (OIDC); solo lo usa el build de Windows fuera de los PR.
    environment: ${{ (matrix.os == 'windows-latest' && github.event_name != 'pull_request') && 'signing' || '' }}
    env:
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Versión de desarrollo (push a dev)
        if: github.event_name == 'push'
        shell: bash
        run: npm version "${{ needs.meta.outputs.version }}" --no-git-tag-version
      - run: npm run ${{ matrix.script }}

      # Firma de Windows con Azure Artifact Signing (antes Trusted Signing): sin firma, Smart App Control bloquea la app.
      # Se firman todos los binarios del paquete (exe, dll y módulos nativos), porque Windows revisa cada uno al cargarlo.
      # No se firma en los PR. Si faltan las variables de Azure, el build sigue sin firmar y deja un aviso.
      - name: Comprobar configuración de firma (Windows)
        id: signing
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -n "${{ vars.AZURE_CLIENT_ID }}" ] && [ -n "${{ vars.AZURE_SIGNING_ENDPOINT }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Firma de Windows desactivada: faltan las variables AZURE_* del repositorio. El .zip saldrá sin firmar y Smart App Control lo bloqueará."
          fi
      - name: Azure login (OIDC)
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Firmar binarios (Windows)
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\Usage Monitor-win32-x64
          files-folder-filter: exe,dll,node
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Usage Monitor
          description-url: https://github.com/${{ github.repository }}
      - name: Verificar firmas (Windows)
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $bad = Get-ChildItem "dist/Usage Monitor-win32-x64" -Recurse -Include *.exe,*.dll,*.node |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($bad) { $bad.FullName | ForEach-Object { "Sin firma válida: $_" }; exit 1 }
          "Todos los binarios están firmados."

      - name: Instalador .dmg (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/make-dmg.sh "dist/Usage Monitor-darwin-arm64/Usage Monitor.app" "dist/Usage-Monitor-${TAG}-macos-arm64.dmg"
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/Usage Monitor-win32-x64" -DestinationPath "dist/Usage-Monitor-$env:TAG-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: usage-monitor-${{ matrix.name }}
          path: dist/Usage-Monitor-*
          if-no-files-found: error

      - name: Adjuntar al release
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/Usage-Monitor-* --clobber --repo "$GITHUB_REPOSITORY"

  # Push a dev: pre-release propio con los instaladores de este commit; se conservan los últimos 10 de dev.
  dev-release:
    needs: [meta, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Pre-release de dev
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          image="ghcr.io/${REPO,,}-server:$VERSION"
          notes="Compilación automática de la rama dev (${SHA:0:7}). No es estable: úsala para probar.

          Servidor: \`$image\` (o \`:dev\` para seguir siempre la última de dev)."
          gh release create "$TAG" dist/Usage-Monitor-* --repo "$REPO" --target "$SHA" --prerelease --title "$TAG (dev)" --notes "$notes"
      - name: Limpiar pre-releases de dev antiguos (se conservan 10)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # El antiguo pre-release rodante «dev» (y su tag, que chocaba con la rama dev) ya no se usa.
          gh release delete dev --repo "$REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release list --repo "$REPO" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("-dev\\.[0-9]+$"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
          while read -r old; do
            echo "Borrando $old"
            gh release delete "$old" --repo "$REPO" --cleanup-tag --yes
          done
