name: server-image
# Imagen del servicio opcional (server/) en ghcr.io:
#   release publicado → X.Y.Z, X.Y y latest
#   push a dev        → dev y dev-<sha>, con versión X.Y.Z-dev.N dentro (la app la muestra y la compara)
#   PR que toca server/ → solo compila, sin publicar
on:
  release:
    types: [published]
  push:
    branches: [dev]
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/usage-monitor-server

jobs:
  image:
    # El pre-release «dev» no es una versión: su imagen sale del push a dev.
    if: github.event_name != 'release' || github.event.release.tag_name != 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versión de desarrollo (push a dev)
        if: github.event_name == 'push'
        working-directory: server
        run: npm version "$(node -p "require('./package.json').version")-dev.${{ github.run_number }}" --no-git-tag-version
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login a ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=dev,enable=${{ github.event_name == 'push' }}
            type=sha,prefix=dev-,enable=${{ github.event_name == 'push' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=usage-monitor-server
            org.opencontainers.image.description=Servicio opcional de Usage Monitor: consulta el uso de claude.ai y lo sirve por HTTP
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
