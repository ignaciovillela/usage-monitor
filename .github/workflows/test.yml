name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/
      # Backtest rápido con usuarios sintéticos (falla si hay una excepción)
      - run: node tests/run-backtest.js --days 14 --seeds 1
